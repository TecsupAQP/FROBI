# FROBI en un VPS: front + API + Postgres + Redis detrás de Caddy (HTTPS automático).
#
#   cp deploy/.env.example deploy/.env    # y llénalo
#   docker compose -f deploy/compose.yml --env-file deploy/.env up -d --build
#
# Solo Caddy publica puertos (80 y 443). Postgres y Redis quedan dentro de la red de Docker.

name: frobi-vps

services:
  web:
    image: frobi-web:latest
    build:
      context: ../frontend
    restart: unless-stopped
    mem_limit: 96m
    environment:
      # Sin dominio, Caddy escucha en :80 (http con la IP del VPS).
      FROBI_DOMAIN: ${FROBI_DOMAIN:-:80}
    ports:
      - "${FROBI_HTTP_PORT:-80}:80"
      - "${FROBI_HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    image: frobi-api:latest
    build:
      context: ../backend
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    mem_limit: 320m
    environment:
      FROBI_ENVIRONMENT: ${FROBI_ENVIRONMENT:-demo}
      FROBI_DATABASE_URL: postgresql+asyncpg://frobi:${POSTGRES_PASSWORD:?Pon POSTGRES_PASSWORD en deploy/.env}@postgres:5432/frobi
      FROBI_REDIS_URL: redis://redis:6379/0
      # Front y API comparten dominio; esto solo importa si otro front llama a la API.
      FROBI_CORS_ORIGINS: ${FROBI_CORS_ORIGINS:-http://localhost}
      FROBI_LLM_PROVIDER: ${FROBI_LLM_PROVIDER:-anthropic}
      FROBI_LLM_API_KEY: ${FROBI_LLM_API_KEY:-}
      FROBI_LLM_MODEL: ${FROBI_LLM_MODEL:-}
      FROBI_LLM_BASE_URL: ${FROBI_LLM_BASE_URL:-}
      FROBI_R2_ENDPOINT: ${FROBI_R2_ENDPOINT:-}
      FROBI_R2_ACCESS_KEY_ID: ${FROBI_R2_ACCESS_KEY_ID:-}
      FROBI_R2_SECRET_ACCESS_KEY: ${FROBI_R2_SECRET_ACCESS_KEY:-}
      FROBI_R2_BUCKET: ${FROBI_R2_BUCKET:-frobi}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_USER: frobi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Pon POSTGRES_PASSWORD en deploy/.env}
      POSTGRES_DB: frobi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frobi -d frobi"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    mem_limit: 64m
    # Guarda las sesiones en disco para que sobrevivan a un reinicio.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
